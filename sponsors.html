<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	html, body {
		overflow-x: hidden;
	}

	img {
		display: block;
	}

	@keyframes fadeIn {
		from { opacity: 0; }
		to { opacity: 1 }
	}

	@keyframes fadeInDown {
		from{
			opacity: 0;
			transform: translateY(-10px);
		}

		to {
			opacity: 1;
			transform: translateY(0px);
		}
	}

	html {
		overflow-x: hidden;
	}

	body {
		background-image: url(img/seigaha.jpg);
		background-color: rgba(255,255,255,0.8);
		background-blend-mode: lighten;
		font-family: "Zen Old Mincho", serif;
		margin: 0;
		width: 100%;
		animation: fadeIn 0.8s ease-out;
		overflow-x: hidden;
	}

	#headerSpace {
		height: 250px;
	}

@media(1000px < width) {
	header {
		color: white;
		font-size: 24px;
		height: 100px;
		align-content: center;
		background: linear-gradient(160deg, #3333D2, #5555D2);
		list-style: none;
		display: flex;
		position: fixed;
		width: 100%;
		justify-content: space-between;
		animation: fadeInDown 1.0s ease-out;
	}

	img {
		display: block;
		min-height: 100%;
		/* 画像のドラッグや選択を無効化 */
		-webkit-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
		  
		/* クリックやタップの操作を無効化 */
		pointer-events: none;
	}

		margin: auto 0;
		padding: 0;
		width: 100%;
		list-style: none;
		display: flex;
		gap: 88px;
		
	}

	#tabs_list li{
		display: flex;
		text-align: center;
	}

	#tabs_list a {
		text-decoration: none;
		color: inherit;
	}

	#tabs_list_mobile {
		display: none;
	}

	.headerList {
		position: relative;
		display: inline-block;
	}

	.headerList::after {
		content: '';
		position: absolute;
		display: block;
		margin: 0 auto;
		bottom: -2px;
		width: 0;
		height: 2px;
		background: #dddddd;
		transition: width 0.6s ease;
	}

	.headerList:hover::after {
		width: 100%;
	}

	#contents {
		margin: 0 auto;
		width: 65%;
	}

	.carousel {
		width: 100%;
		background: #ccddff;
		margin: 0 auto;
		display: flex;
	}

	.carousel picture {
		pointer-events: none;
	}

	.slide {
		display: block;
		height: auto;
		margin: 0 auto;
		white-space: nowrap;
	}

	#sponsorshipRiv {
		height: 100%;
		display: flex;
		gap: 100px;
	}

	.sponSlide {
		margin: auto 0;
		font-size: 50px;
		white-space: nowrap;

	#slides {
		width: 100%;
		background: #ccddff;
		display: flex;
	}

		border-radius: 5px;
		background-color: rgba(245,245,245,0.7);
		background-blend-mode: lighten;
		box-shadow: 0 5px 20px rgba(100, 100, 100, 0.3);
	}

	.newsBoxDate {
		font-size: 20px;
		margin: 10px;
	}

	.newsTopic {
		display: flex;
		font-size: 20px;
		border-bottom: 2px solid #aaaaaa;
	}

	.newsTitle {
		margin: auto;
	}

	#explainers {
		width: 80%;
		margin: 0 auto;
	}

	.expBox {
		border-radius: 20px;
		background-color: rgba(245,245,245,1);
		background-blend-mode: lighten;
		box-shadow: 0 5px 20px rgba(100, 100, 100, 0.3);
		opacity: 0;
		transform: translateY(20px);
		transition: opacity 0.6s ease, transform 0.6s ease;
	}

	.expBox.visible {
		opacity: 1;
		transform: translateY(0);
	}

	.eventBox {
		border-radius: 20px;
		background-color: rgba(245,245,245,1); /*245, 245, 245, 1*/
		background-blend-mode: lighten;
		box-shadow: 0 5px 20px rgba(100, 100, 100, 0.3);
		padding: 50px;
		margin-bottom: 200px;
	}

	.eventTitle {
		display: inline-block;
		font-size: 45px;
		border-bottom: 2px solid #777799;
	}

	.eventContent {
		display: flex;
		padding-top: 24px;
		font-size: 22px;
	}

	.sponsorBox_big {
		margin: 0 auto;
		width: 900px;
		border-radius: 20px;
		background-color: rgba(245,245,245,1); /*245, 245, 245, 1*/
		background-blend-mode: lighten;
		box-shadow: 0 5px 20px rgba(100, 100, 100, 0.3);
		padding: 50px;
		margin-bottom: 200px;
		font-size: 30px;
		text-align: center;
	}

	.sponsorBox_big img {
		margin: 0 auto;
		padding: 40px 0;
		max-width: 80%;
	}

	.sponsorBox_small_parent {
		margin: 0 auto;
		display: flex;
		width: 900px;
		gap: 40px;
	}

		margin: 0 auto;

		border-radius: 20px;
		background-color: rgba(245,245,245,1); /*245, 245, 245, 1*/
		background-blend-mode: lighten;
		box-shadow: 0 5px 20px rgba(100, 100, 100, 0.3);
		padding: 50px;
		margin-bottom: 200px;
		font-size: 20px;
		text-align: center;
	}

	.sponsorBox_small img {
		margin: 0 auto;
		padding: 20px 0;
		max-width: 100%;
	}

	#boxes {
		display: flex;
		width: 80%;
		margin: 0 auto;
		margin-bottom: 300px;
	}

	.box {
		border: 2px solid #bbbbdd;
		border-radius: 10px;
		color: #333355;
		width: 25%;
		margin: auto;
		font-size: 30px;
		text-align: center;
		background-color: rgba(255,255,255,0.5);
		background-blend-mode: lighten;
		box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
		transition: background 0.3s ease; /* なめらかに変化させる */
		transition: color 0.3 ease;
	}

	.box:hover {
		/* カーソルが乗ったときの状態 */
		color: #111111;
		background-color: rgba(10,10,10,0.3);

	}

	}

		background-blend-mode: lighten;

}
